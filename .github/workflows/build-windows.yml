name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: BankTransferConverter_EXE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        working-directory: BankTransferConverter_EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name HolyokeTransferConverter desktop_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HolyokeTransferConverter-Windows
          path: BankTransferConverter_EXE/dist/HolyokeTransferConverter.exe
